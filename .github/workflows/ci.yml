name: ci

# Docs-only changes skip CI. main has no required status checks, so a skipped
# run can't strand anything; if required checks are ever added, these filters
# would leave docs-only PRs waiting on a check that never reports.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  # desktop-release reuses this as its pre-publish gate.
  workflow_call:

# A newer push to the same PR cancels the older run. On main the group is the
# commit itself, so every commit there runs to completion. github.workflow is
# the caller's name under workflow_call, so a release never queues behind main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Only electron-builder needs the Electron binary, and it never runs here.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  # Reads only the lockfile, so it needs no install, and a newly published
  # advisory can't hide lint/test/build results behind it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # audit has its own job; skip npm ci's built-in registry audit.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run check:structure
      - run: npm run build:budget

  smoke-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Headless runs use the headless shell; the full Chromium download is unused.
      - run: npx playwright install --with-deps --only-shell chromium
      # Scale out across machines, not workers: animation-timing specs flake when
      # 4 workers contend for the runner's 4 vCPUs alongside the dev server.
      - run: npm run test:smoke -- --fully-parallel --shard=${{ matrix.shard }}/6
